[project]
name = "automate-food-places-outreach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bryan", email = "changjieruibryan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
automate-food-places-outreach = "automate_food_places_outreach:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
